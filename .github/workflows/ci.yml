name: ci
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extract payload
        run: |
          python3 -c "import glob,zipfile,os;f=(glob.glob('*.png')+[None])[0];print('payload',f);zipfile.ZipFile(f).extractall('.') if f else None;os.remove(f) if f else None"
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - run: gradle :app:assembleDebug -PwithNative=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
